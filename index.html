    <script>
      // Suppress Vite HMR WebSocket and transient Firestore offline probing errors in cloud preview iframe
      (function() {
        var origError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var text = args.map(function(a) { return String(a && a.message ? a.message : a); }).join(' ');
          if (
            text.indexOf('Could not reach Cloud Firestore backend') !== -1 ||
            text.indexOf('@firebase/firestore') !== -1 ||
            text.indexOf('[code=unavailable]') !== -1 ||
            text.indexOf('the client is offline') !== -1 ||
            text.indexOf('@vite/client') !== -1 ||
            text.indexOf('WebSocket') !== -1
          ) {
            console.warn.apply(console, args);
            return;
          }
          return origError.apply(console, args);
        };
      })();
      window.addEventListener('error', function(e) {
        if (e && (
          (e.message && (
            e.message.includes('WebSocket') ||
            e.message.includes('websocket') ||
            e.message.includes('@vite/client') ||
            e.message.includes('Could not reach Cloud Firestore backend') ||
            e.message.includes('[code=unavailable]')
          )) ||
          (e.filename && e.filename.includes('@vite/client'))
        )) {
          e.preventDefault();
          e.stopPropagation();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        if (e && e.reason && (
          String(e.reason).includes('WebSocket') ||
          String(e.reason).includes('websocket') ||
          String(e.reason).includes('@vite/client') ||
          String(e.reason).includes('Could not reach Cloud Firestore backend') ||
          String(e.reason).includes('[code=unavailable]') ||
          String(e.reason).includes('the client is offline')
        )) {
          e.preventDefault();
          e.stopPropagation();
        }
      }, true);
    </script>
