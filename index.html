    <meta name="description" content="Study Top — Created by Manjit Ranjan (Google Developer). AI-powered note-making, source-grounded research, and interactive study platform." />

    <link rel="icon" type="image/png" href="/assets/aistudio/file_00000000c08481fa98304e6f030e53d7_93183212.png" />
    <link rel="apple-touch-icon" href="/assets/aistudio/file_00000000c08481fa98304e6f030e53d7_93183212.png" />
    <link rel="manifest" href="/manifest.json" />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&display=swap" rel="stylesheet">
    <script>
      // Suppress Vite HMR WebSocket errors in cloud preview iframe
      window.addEventListener('error', function(e) {
        if (e && (
          (e.message && (e.message.includes('WebSocket') || e.message.includes('websocket') || e.message.includes('@vite/client'))) ||
          (e.filename && e.filename.includes('@vite/client'))
        )) {
          e.preventDefault();
          e.stopPropagation();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        if (e && e.reason && (
          String(e.reason).includes('WebSocket') ||
          String(e.reason).includes('websocket') ||
          String(e.reason).includes('@vite/client')
        )) {
          e.preventDefault();
          e.stopPropagation();
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
