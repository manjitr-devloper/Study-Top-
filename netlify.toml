[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Reverse proxy backend API calls so client on Netlify reaches the Cloud server seamlessly
[[redirects]]
  from = "/api/*"
  to = "https://ais-pre-dexg65p2k7wdhydz6k57ax-798150476797.asia-southeast1.run.app/api/:splat"
  status = 200
  force = true

# SPA fallback: all internal routing points to /index.html to prevent 404 errors on refresh
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
